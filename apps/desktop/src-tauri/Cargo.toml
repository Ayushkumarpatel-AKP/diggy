[package]
name = "diggy-desktop"
version = "0.1.0"
description = "Diggy desktop companion: a transparent, always-on-top avatar overlay plus a supervisor for the local Node bridge."
authors = ["Diggy"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The overlay only needs the app itself — no devtools in release — so favour a
# small, stripped binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
